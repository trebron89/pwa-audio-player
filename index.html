<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Odtwarzacz">
  <meta name="theme-color" content="#111214">
  <title>Odtwarzacz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn back" hidden aria-label="Wstecz">‹</button>
    <h1 id="viewTitle">Biblioteka</h1>
    <span id="status" class="status" aria-live="polite"></span>
  </header>

  <main id="main"></main>

  <footer class="dock" id="dock">
    <section class="player">
      <div class="now">
        <div id="nowTitle" class="now-title">Nic nie gra</div>
        <div id="nowSub" class="now-sub">Wybierz utwór z biblioteki</div>
      </div>
      <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="Pozycja w utworze">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="controls">
        <button id="btnRate" class="rate" aria-label="Prędkość odtwarzania">1×</button>
        <button id="btnPrev" aria-label="Poprzedni utwór">⏮&#xFE0E;</button>
        <button id="btnBack" class="skip" aria-label="Cofnij 15 sekund">−15</button>
        <button id="btnPlay" class="play" aria-label="Odtwarzaj lub pauza">▶&#xFE0E;</button>
        <button id="btnFwd" class="skip" aria-label="Do przodu 30 sekund">+30</button>
        <button id="btnNext" aria-label="Następny utwór">⏭&#xFE0E;</button>
      </div>
    </section>
    <nav class="tabs">
      <button data-view="library" class="active">Biblioteka</button>
      <button data-view="playlists">Playlisty</button>
      <button data-view="settings">Ustawienia</button>
    </nav>
  </footer>

  <audio id="audio" preload="auto" playsinline></audio>
  <input id="fileInput" type="file" multiple hidden
         accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.aif,.aiff,.caf,.flac,.opus,.ogg">
  <input id="jsonInput" type="file" hidden accept="application/json,.json">
  <dialog id="sheet"><div id="sheetBody"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
