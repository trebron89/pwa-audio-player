<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NPlayer">
  <meta name="theme-color" content="#09090e">
  <title>NPlayer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="tags.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <button id="back" class="ibtn back" hidden aria-label="Wstecz" data-icon="back"></button>
    <div class="heading">
      <span class="brand">NPlayer</span>
      <h1 id="viewTitle">Biblioteka</h1>
    </div>
    <span id="status" class="status" aria-live="polite"></span>
  </header>

  <main id="main"></main>

  <footer class="dock no-track" id="dock">
    <div class="mini" id="mini">
      <button class="mini-open" id="miniOpen" aria-label="Otwórz odtwarzacz">
        <div class="art art-sm" id="miniArt" data-icon="note"></div>
        <div class="mini-text">
          <div id="miniTitle" class="mini-title">Nic nie gra</div>
          <div id="miniSub" class="mini-sub"></div>
        </div>
      </button>
      <button class="ibtn" id="miniPlay" aria-label="Odtwarzaj lub pauza" data-icon="play"></button>
      <button class="ibtn" id="miniNext" aria-label="Następny utwór" data-icon="next"></button>
      <div class="mini-progress"><div id="miniBar"></div></div>
    </div>
    <nav class="tabs">
      <button data-view="library" class="active"><i data-icon="lib"></i><span>Biblioteka</span></button>
      <button data-view="playlists"><i data-icon="lists"></i><span>Playlisty</span></button>
      <button data-view="settings"><i data-icon="settings"></i><span>Ustawienia</span></button>
    </nav>
  </footer>

  <section id="full" class="full" aria-hidden="true" aria-label="Odtwarzacz">
    <div class="full-bg" id="fullBg"></div>
    <div class="full-inner">
      <div class="full-head">
        <button id="fullClose" class="ibtn" aria-label="Zamknij odtwarzacz" data-icon="down"></button>
        <div class="full-from"><small>Odtwarzane z</small><b id="fullSource">Biblioteka</b></div>
        <button id="fullRate" class="pill-sm" aria-label="Prędkość odtwarzania">1×</button>
      </div>
      <div class="full-art-wrap">
        <div class="art art-xl" id="fullArt" data-icon="note"></div>
      </div>
      <div class="full-meta">
        <div id="fullTitle" class="full-title">Nic nie gra</div>
        <div id="fullSub" class="full-sub"></div>
      </div>
      <div class="queue" id="queue">
        <div class="queue-head">Teraz odtwarzane · <b id="queueSrc"></b></div>
        <ul class="list" id="queueList"></ul>
      </div>
      <input id="seek" class="seek" type="range" min="0" max="1" step="1" value="0" aria-label="Pozycja w utworze">
      <div class="times"><span id="tCur">0:00</span><span id="tLeft">−0:00</span></div>
      <div class="full-controls">
        <button id="btnPrev" class="ibtn big" aria-label="Poprzedni utwór" data-icon="prev"></button>
        <button id="btnPlay" class="playbtn" aria-label="Odtwarzaj lub pauza" data-icon="play"></button>
        <button id="btnNext" class="ibtn big" aria-label="Następny utwór" data-icon="next"></button>
      </div>
      <div class="full-foot">
        <button id="fullTimer" class="ibtn" aria-label="Wyłącznik czasowy" data-icon="moon"></button>
        <span class="full-pos"><span id="fullPos"></span><span id="sleepLeft" class="sleep-left" hidden></span></span>
        <button id="fullQueue" class="ibtn" aria-label="Teraz odtwarzane" aria-pressed="false" data-icon="queue"></button>
      </div>
    </div>
  </section>

  <audio id="audio" preload="auto" playsinline></audio>
  <input id="fileInput" type="file" multiple hidden
         accept="audio/*,image/*,.mp3,.m4a,.m4b,.aac,.wav,.aif,.aiff,.caf,.flac,.opus,.ogg">
  <input id="folderInput" type="file" multiple hidden webkitdirectory>
  <input id="coverInput" type="file" hidden accept="image/*">
  <input id="jsonInput" type="file" hidden accept="application/json,.json">
  <dialog id="sheet"><div class="grabber"></div><div id="sheetBody"></div></dialog>
</body>
</html>
